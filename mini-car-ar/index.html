<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Mini Car Showroom AR</title>

  <!-- These libraries make the AR scene work -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #status {
      position: fixed; top: 0; left: 0; right: 0;
      background: #b3261e; color: white;
      text-align: center; padding: 13px 8px;
      z-index: 10; font-size: 15px;
    }
    #help {
      position: fixed; bottom: 12px; left: 10px; right: 10px;
      background: rgba(0, 0, 0, 0.7); color: white;
      text-align: center; padding: 10px; border-radius: 8px;
      z-index: 10; font-size: 13px;
    }
    #retry {
      border: 1px solid white; background: transparent; color: white;
      border-radius: 4px; padding: 4px 8px; margin-left: 5px;
    }
  </style>

  <script>
    // Tap the ball to change its colour.
    AFRAME.registerComponent('change-color', {
      init: function () {
        var colors = ['red', 'yellow', 'blue', 'green'];
        var number = 0;
        this.el.addEventListener('click', () => {
          number = (number + 1) % colors.length;
          this.el.setAttribute('color', colors[number]);
        });
      }
    });

    // My own interaction: tap the box to make it bigger or smaller.
    AFRAME.registerComponent('change-size', {
      init: function () {
        var big = false;
        this.el.addEventListener('click', () => {
          big = !big;
          this.el.setAttribute('scale', big ? '1.5 1.5 1.5' : '1 1 1');
        });
      }
    });

    // Change the status banner when the Hiro marker is seen.
    AFRAME.registerComponent('marker-message', {
      init: function () {
        var status = document.getElementById('status');
        this.el.addEventListener('markerFound', () => {
          status.textContent = 'Marker Found! Tap the ball and the box';
          status.style.background = '#237a35';
        });
        this.el.addEventListener('markerLost', () => {
          status.textContent = 'Marker Lost! Show the Hiro marker';
          status.style.background = '#b3261e';
        });
      }
    });

    // The AR library opens the camera and asks for browser permission.
    // This button is only for trying again if permission was blocked.
    function retryCamera() {
      window.location.reload();
    }
  </script>
</head>

<body>
  <div id="status">Allow the camera, then scan the Hiro marker</div>
  <div id="help">
    Point your phone camera at a printed Hiro marker.
    <button id="retry" onclick="retryCamera()">Retry camera</button>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;"
           renderer="logarithmicDepthBuffer: true;">

    <a-assets timeout="30000">
      <!-- Free CC0 Toy Car model from Khronos glTF Sample Assets -->
      <a-asset-item id="car"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/ToyCar/glTF-Binary/ToyCar.glb">
      </a-asset-item>
    </a-assets>

    <a-marker preset="hiro" marker-message>
      <!-- Showroom floor -->
      <a-plane position="0 0 0" rotation="-90 0 0"
               width="1.8" height="1.8" color="#444444"></a-plane>

      <!-- A small stand underneath the car -->
      <a-cylinder position="0 0.07 0" radius="0.67" height="0.14"
                  color="#777777"></a-cylinder>

      <!-- A real 3D car model that slowly spins -->
      <a-entity gltf-model="#car" position="0 0.16 0" scale="0.18 0.18 0.18"
        animation="property: rotation; to: 0 360 0; dur: 8000; easing: linear; loop: true">
      </a-entity>

      <!-- Ball bounces and changes colour when tapped -->
      <a-sphere class="clickable" change-color
        position="-0.65 0.30 0.48" radius="0.16" color="red"
        animation="property: position; from: -0.65 0.30 0.48; to: -0.65 0.55 0.48;
                   dir: alternate; dur: 900; loop: true">
      </a-sphere>

      <!-- Box grows when tapped -->
      <a-box class="clickable" change-size
             position="0.65 0.2 0.48" width="0.3" height="0.3" depth="0.3"
             color="orange"></a-box>

      <!-- Another primitive: a little cone decoration -->
      <a-cone position="-0.70 0.18 -0.55" radius-bottom="0.16"
              height="0.35" color="yellow"></a-cone>

      <!-- Scene label -->
      <a-text value="MINI CAR SHOWROOM" position="0 0.85 -0.50"
              rotation="-40 0 0" align="center" width="2.4" color="white"></a-text>
    </a-marker>

    <a-entity camera cursor="rayOrigin: mouse"
              raycaster="objects: .clickable"></a-entity>
  </a-scene>
</body>
</html>
